<style>

<body>
<header>EXFT <span>BETA 1.1</span></header>

<div id="game-container">
    <div id="info">
        <span>VOCÊ: VERDE</span>
        <strong id="score">0 - 0</strong>
        <span>ADVERSÁRIO: VERMELHO</span>
    </div>

    <canvas id="game" width="1000" height="600"></canvas>

    <div id="controls">
        <div class="dpad">
            <button class="ctrl" id="up" data-key="w">▲</button>
            <button class="ctrl" id="left" data-key="a">◀</button>
            <button class="ctrl" id="down" data-key="s">▼</button>
            <button class="ctrl" id="right" data-key="d">▶</button>
        </div>

        <div id="actions">
            <button class="ctrl" id="sprint" data-key="shift">CORRER</button>
            <button class="ctrl" id="shoot">CHUTAR</button>
        </div>
    </div>

    <button id="restart">Reiniciar partida</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const keys = Object.create(null);

let playerScore = 0;
let enemyScore = 0;
let lastTime = 0;
let gameTime = 0;
let message = "";
let messageTime = 0;

let playerKickLock = 0;
let enemyKickLock = 0;
let playerStealLock = 0;
let enemyStealLock = 0;

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function makePlayer(x, y, color, r = 17) {
    return {
        x, y, color, r,
        vx: 0, vy: 0,
        fx: 1, fy: 0,
        speed: 250,
        hasBall: false,
        runTime: 0,
        kickFlash: 0
    };
}

let player, enemy, keeperPlayer, keeperEnemy, ball;

function resetPositions() {
    player = makePlayer(260, 300, "#38f078");
    enemy = makePlayer(740, 300, "#f04b4b");
    enemy.fx = -1;

    keeperPlayer = makePlayer(65, 300, "#48baff", 18);
    keeperEnemy = makePlayer(935, 300, "#48baff", 18);

    keeperPlayer.speed = 75;
    keeperEnemy.speed = 75;

    ball = {
        x: 500,
        y: 300,
        r: 8,
        vx: 0,
        vy: 0,
        owner: null,
        spin: 0,
        lastTouch: null
    };

    playerKickLock = 0;
    enemyKickLock = 0;
    playerStealLock = 0;
    enemyStealLock = 0;
}

resetPositions();

function updateScore() {
    document.getElementById("score").textContent =
        playerScore + " - " + enemyScore;
}

function showMessage(text, duration = 1.2) {
    message = text;
    messageTime = duration;
}

function resetAfterGoal(scoredByPlayer) {
    if (scoredByPlayer) {
        playerScore++;
        showMessage("GOOOOL!", 1.5);
    } else {
        enemyScore++;
        showMessage("GOL DO ADVERSÁRIO!", 1.5);
    }

    updateScore();
    resetPositions();
}

function getMovementInput() {
    let x = 0;
    let y = 0;

    if (keys.a || keys.arrowleft) x--;
    if (keys.d || keys.arrowright) x++;
    if (keys.w || keys.arrowup) y--;
    if (keys.s || keys.arrowdown) y++;

    const len = Math.hypot(x, y);

    if (len > 0) {
        x /= len;
        y /= len;
    }

    return { x, y, len };
}

/* MOVIMENTAÇÃO ARCADE */

function movePlayerArcade(p, inputX, inputY, dt, sprint = false) {
    const inputLen = Math.hypot(inputX, inputY);

    if (inputLen > 1) {
        inputX /= inputLen;
        inputY /= inputLen;
    }

    const carrying = ball.owner === p;
    const sprinting = sprint && inputLen > 0;

    let maxSpeed = p === player ? 300 : 205;

    if (carrying) maxSpeed *= 0.91;
    if (sprinting) maxSpeed *= 1.32;

    if (inputLen > 0) {
        const targetVX = inputX * maxSpeed;
        const targetVY = inputY * maxSpeed;

        const reversing =
            p.vx * inputX + p.vy * inputY < -20;

        const response = reversing ? 15 : 20;
        const blend = Math.min(1, response * dt);

        p.vx += (targetVX - p.vx) * blend;
        p.vy += (targetVY - p.vy) * blend;

        p.vx += inputX * 2300 * dt * 0.18;
        p.vy += inputY * 2300 * dt * 0.18;

        p.fx = inputX;
        p.fy = inputY;
    } else {
        const friction = Math.exp(-12 * dt);
        p.vx *= friction;
        p.vy *= friction;
    }

    const speed = Math.hypot(p.vx, p.vy);

    if (speed > maxSpeed) {
        p.vx = p.vx / speed * maxSpeed;
        p.vy = p.vy / speed * maxSpeed;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.x = clamp(p.x, p.r + 5, W - p.r - 5);
    p.y = clamp(p.y, p.r + 5, H - p.r - 5);

    if (speed > 20) {
        p.runTime += dt * (sprinting ? 15 : 10);
    } else {
        p.runTime *= Math.exp(-8 * dt);
    }

    p.kickFlash = Math.max(0, p.kickFlash - dt);
}

function moveToArcade(p, tx, ty, speed, dt) {
    const dx = tx - p.x;
    const dy = ty - p.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 4) {
        const friction = Math.exp(-10 * dt);
        p.vx *= friction;
        p.vy *= friction;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        return;
    }

    const factor = Math.min(1, dist / 65);
    const targetSpeed = speed * factor;
    const nx = dx / dist;
    const ny = dy / dist;
    const blend = Math.min(1, 11 * dt);

    p.vx += (nx * targetSpeed - p.vx) * blend;
    p.vy += (ny * targetSpeed - p.vy) * blend;

    const currentSpeed = Math.hypot(p.vx, p.vy);

    if (currentSpeed > speed) {
        p.vx = p.vx / currentSpeed * speed;
        p.vy = p.vy / currentSpeed * speed;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.x = clamp(p.x, p.r + 5, W - p.r - 5);
    p.y = clamp(p.y, p.r + 5, H - p.r - 5);

    const actualSpeed = Math.hypot(p.vx, p.vy);

    if (actualSpeed > 12) {
        p.fx = p.vx / actualSpeed;
        p.fy = p.vy / actualSpeed;
    }

    p.runTime += dt * 9;
}

/* POSSE E CHUTES */

function attachBall(p) {
    if (ball.owner && ball.owner !== p) {
        ball.owner.hasBall = false;
    }

    ball.owner = p;
    p.hasBall = true;
    ball.lastTouch = p;

    const distance = p.r + ball.r + 5;

    ball.x = p.x + p.fx * distance;
    ball.y = p.y + p.fy * distance;
    ball.vx = p.vx;
    ball.vy = p.vy;
}

function releaseBall() {
    if (ball.owner) {
        ball.owner.hasBall = false;
        ball.owner = null;
    }
}

function shoot(p) {
    if (ball.owner !== p) return;

    let dx = p.fx;
    let dy = p.fy;

    if (Math.hypot(dx, dy) < 0.1) {
        dx = p === player ? 1 : -1;
        dy = 0;
    }

    if (p === enemy) {
        dx = -Math.max(0.35, Math.abs(dx));
        dy = p.fy;
    }

    const len = Math.hypot(dx, dy) || 1;
    dx /= len;
    dy /= len;

    const runningSpeed = Math.hypot(p.vx, p.vy);
    const bonus = Math.min(100, runningSpeed * 0.20);
    const power = (p === player ? 600 : 475) + bonus;

    releaseBall();

    ball.x = p.x + dx * (p.r + ball.r + 7);
    ball.y = p.y + dy * (p.r + ball.r + 7);

    ball.vx = dx * power;
    ball.vy = dy * power;
    ball.spin = dy * 0.7;
    ball.lastTouch = p;

    p.kickFlash = 0.16;

    if (p === player) {
        playerKickLock = 0.42;
    } else {
        enemyKickLock = 1.15;
    }
}

function attemptPlayerShot() {
    if (ball.owner === player) {
        shoot(player);
        return;
    }

    const dist = Math.hypot(ball.x - player.x, ball.y - player.y);

    if (!ball.owner && dist < 43 && playerKickLock <= 0) {
        attachBall(player);
    }
}

/* JOGADOR CONTROLADO */

function updatePlayer(dt) {
    const input = getMovementInput();

    movePlayerArcade(
        player,
        input.x,
        input.y,
        dt,
        !!keys.shift
    );

    playerStealLock = Math.max(0, playerStealLock - dt);
    playerKickLock = Math.max(0, playerKickLock - dt);

    // O jogador também pode recuperar a bola do adversário.
    if (ball.owner === enemy && playerStealLock <= 0) {
        const distance = Math.hypot(
            player.x - enemy.x,
            player.y - enemy.y
        );

        if (distance < player.r + enemy.r + 3) {
            attachBall(player);
            playerStealLock = 0.35;
            showMessage("VOCÊ ROUBOU A BOLA!", 0.7);
        }
    }

    if (!ball.owner && playerKickLock <= 0) {
        const distance = Math.hypot(
            player.x - ball.x,
            player.y - ball.y
        );

        if (distance < player.r + ball.r + 10) {
            attachBall(player);
        }
    }
}

/* ADVERSÁRIO COM ROUBO DE BOLA */

function updateEnemy(dt) {
    enemyKickLock = Math.max(0, enemyKickLock - dt);
    enemyStealLock = Math.max(0, enemyStealLock - dt);

    if (ball.owner === enemy) {
        const targetY = clamp(
            300 + (player.y - 300) * 0.35,
            190,
            410
        );

        moveToArcade(
            enemy,
            Math.max(115, enemy.x - 190),
            targetY,
            165,
            dt
        );

        enemy.fx = -1;

        if (enemy.x < 650 && enemyKickLock <= 0) {
            shoot(enemy);
        }

    } else if (ball.owner === player) {
        // Calcula a distância antes do movimento.
        const distanceBefore = Math.hypot(
            player.x - enemy.x,
            player.y - enemy.y
        );

        // Corre diretamente em direção ao jogador.
        moveToArcade(
            enemy,
            player.x,
            player.y,
            215,
            dt
        );

        const distanceAfter = Math.hypot(
            player.x - enemy.x,
            player.y - enemy.y
        );

        // Alcance ampliado para tornar o roubo confiável.
        if (
            Math.min(distanceBefore, distanceAfter) <
                player.r + enemy.r + 20 &&
            enemyStealLock <= 0
        ) {
            attachBall(enemy);
            enemyStealLock = 0.8;
            enemyKickLock = 0.7;

            showMessage("O ADVERSÁRIO ROUBOU A BOLA!", 0.8);
        }

    } else {
        // Corre atrás da bola solta.
        moveToArcade(
            enemy,
            ball.x + 15,
            ball.y,
            190,
            dt
        );

        const distance = Math.hypot(
            enemy.x - ball.x,
            enemy.y - ball.y
        );

        if (
            distance < enemy.r + ball.r + 12 &&
            enemyKickLock <= 0
        ) {
            attachBall(enemy);
        }
    }
}

/* GOLEIROS */

function updateKeepers(dt) {
    const targetY = clamp(ball.y, 265, 335);

    moveToArcade(keeperPlayer, 65, targetY, 75, dt);
    moveToArcade(keeperEnemy, 935, targetY, 75, dt);
}

/*
 * Quando a bola entra no alcance do goleiro,
 * ele a agarra e a lança para longe da própria baliza.
 */
function collideKeeper(k, direction) {
    if (ball.owner) return;

    const dx = ball.x - k.x;
    const dy = ball.y - k.y;
    const distance = Math.hypot(dx, dy);
    const reach = k.r + ball.r + 15;

    if (distance >= reach) return;

    // Impede que a bola atravesse o goleiro.
    const nx = dx / (distance || 1);
    const ny = dy / (distance || 1);

    ball.x = k.x + nx * (reach + 2);
    ball.y = k.y + ny * (reach + 2);

    // Lança a bola para longe da baliza.
    ball.vx = direction * 430;
    ball.vy = ny * 180 + (Math.random() - 0.5) * 160;
    ball.spin = 0;
    ball.lastTouch = k;

    // Pequena proteção contra contatos repetidos.
    if (k === keeperPlayer) {
        playerKickLock = Math.max(playerKickLock, 0.25);
        showMessage("SEU GOLEIRO DEFENDEU!", 0.8);
    } else {
        enemyKickLock = Math.max(enemyKickLock, 0.25);
        showMessage("GOLEIRO ADVERSÁRIO DEFENDEU!", 0.8);
    }
}

/* BOLA */

function updateBall(dt) {
    if (ball.owner) {
        const p = ball.owner;
        const speed = Math.hypot(p.vx, p.vy);
        const lead = p.r + ball.r + (speed > 150 ? 10 : 5);

        const targetX = p.x + p.fx * lead;
        const targetY = p.y + p.fy * lead;
        const blend = Math.min(1, 22 * dt);

        ball.x += (targetX - ball.x) * blend;
        ball.y += (targetY - ball.y) * blend;
        ball.vx = p.vx;
        ball.vy = p.vy;

        return;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    const drag = Math.exp(-1.35 * dt);
    ball.vx *= drag;
    ball.vy *= drag;

    ball.vy += ball.spin * 8 * dt;
    ball.spin *= Math.exp(-2 * dt);

    // Laterais.
    if (ball.y < ball.r) {
        ball.y = ball.r;
        ball.vy = Math.abs(ball.vy) * 0.75;
    }

    if (ball.y > H - ball.r) {
        ball.y = H - ball.r;
        ball.vy = -Math.abs(ball.vy) * 0.75;
    }

    // Gols.
    const goalTop = 235;
    const goalBottom = 365;
    const insideGoal = ball.y > goalTop && ball.y < goalBottom;

    if (ball.x < 0) {
        if (insideGoal) {
            resetAfterGoal(false);
            return;
        }

        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx) * 0.7;
    }

    if (ball.x > W) {
        if (insideGoal) {
            resetAfterGoal(true);
            return;
        }

        ball.x = W - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.7;
    }

    // Defesas dos dois goleiros.
    collideKeeper(keeperPlayer, 1);
    collideKeeper(keeperEnemy, -1);
}

/* DESENHO DO CAMPO */

function drawField() {
    ctx.fillStyle = "#208d47";
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 10; i++) {
        ctx.fillStyle = i % 2 === 0
            ? "rgba(255,255,255,0.035)"
            : "rgba(0,0,0,0.035)";

        ctx.fillRect(i * 100, 0, 100, H);
    }

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(18, 18, W - 36, H - 36);

    ctx.beginPath();
    ctx.moveTo(W / 2, 18);
    ctx.lineTo(W / 2, H - 18);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 75, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    ctx.strokeRect(18, 190, 140, 220);
    ctx.strokeRect(18, 240, 55, 120);
    ctx.strokeRect(W - 158, 190, 140, 220);
    ctx.strokeRect(W - 73, 240, 55, 120);

    ctx.fillStyle = "#d9e4ee";
    ctx.fillRect(0, 235, 18, 130);
    ctx.fillRect(W - 18, 235, 18, 130);

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 235, 18, 130);
    ctx.strokeRect(W - 18, 235, 18, 130);
}

/* PERSONAGENS E ANIMAÇÕES */

function drawPlayer(p, label) {
    const speed = Math.hypot(p.vx, p.vy);
    const moving = speed > 12;
    const legSwing = moving
        ? Math.sin(p.runTime) * Math.min(7, speed * 0.025)
        : 0;

    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(
        p.x, p.y + p.r * 0.7,
        p.r * 0.95, p.r * 0.45,
        0, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = "#17232d";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(p.x - 5, p.y + 7);
    ctx.lineTo(p.x - 5 - legSwing, p.y + p.r + 3);
    ctx.moveTo(p.x + 5, p.y + 7);
    ctx.lineTo(p.x + 5 + legSwing, p.y + p.r + 3);
    ctx.stroke();

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(
        p.x + p.fx * (p.r - 3),
        p.y + p.fy * (p.r - 3)
    );
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(label, p.x, p.y - p.r - 9);

    if (ball.owner === p) {
        ctx.strokeStyle = "#fff16b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.r + 5 + Math.sin(gameTime * 9) * 1.5,
            0,
            Math.PI * 2
        );
        ctx.stroke();
    }

    if (p.kickFlash > 0) {
        ctx.strokeStyle = "#fff16b";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawBall() {
    ctx.fillStyle = "rgba(0,0,0,0.24)";
    ctx.beginPath();
    ctx.ellipse(
        ball.x + 2, ball.y + 5,
        ball.r + 1, ball.r * 0.55,
        0, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#252525";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = "#222222";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 3, 0, Math.PI * 2);
    ctx.fill();
}

function draw() {
    drawField();

    drawPlayer(keeperPlayer, "GOL");
    drawPlayer(keeperEnemy, "GOL");
    drawPlayer(player, "VOCÊ");
    drawPlayer(enemy, "CPU");

    drawBall();

    if (messageTime > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, messageTime * 2);

        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(250, 245, 500, 100);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(message, W / 2, H / 2);

        ctx.restore();
    }
}

/* LOOP PRINCIPAL */

function update(dt) {
    gameTime += dt;

    if (messageTime > 0) {
        messageTime -= dt;
    }

    updatePlayer(dt);
    updateEnemy(dt);
    updateKeepers(dt);
    updateBall(dt);
}

function loop(timestamp) {
    const dt = Math.min(
        (timestamp - (lastTime || timestamp)) / 1000,
        0.033
    );

    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

/* TECLADO */

window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    if ([
        "arrowup", "arrowdown", "arrowleft", "arrowright", " "
    ].includes(key)) {
        e.preventDefault();
    }

    if (key === " " && !e.repeat) {
        attemptPlayerShot();
    } else {
        keys[key] = true;
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

/* CONTROLES DE CELULAR */

document.querySelectorAll("[data-key]").forEach(button => {
    const key = button.dataset.key;

    const press = e => {
        e.preventDefault();
        keys[key] = true;
        button.classList.add("active");

        if (button.setPointerCapture && e.pointerId !== undefined) {
            try {
                button.setPointerCapture(e.pointerId);
            } catch (_) {}
        }
    };

    const release = e => {
        e.preventDefault();
        keys[key] = false;
        button.classList.remove("active");
    };

    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
});

document.getElementById("shoot").addEventListener("pointerdown", e => {
    e.preventDefault();
    attemptPlayerShot();
});

document.getElementById("restart").addEventListener("click", () => {
    playerScore = 0;
    enemyScore = 0;

    updateScore();
    resetPositions();
    showMessage("PARTIDA REINICIADA", 1);
});

updateScore();
requestAnimationFrame(loop);
</script>
</body>
</html>
